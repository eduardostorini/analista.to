{% extends "layout/base.html" %}
{% block title %}Página não encontrada — {{ site_name }}{% endblock %}
{% block robots_meta %}<meta name="robots" content="noindex, follow">{% endblock %}
{% block content %}
<div class="card text-center py-16">
  <p class="badge-neutral mb-4">Erro 404</p>
  <h1 class="text-3xl mb-3">Página não encontrada</h1>
  <p class="text-slate-600 mb-6">O endereço acessado não existe ou a consulta expirou.</p>
  <a href="/" class="btn-primary">Voltar para a página inicial</a>
</div>
{% endblock %}
