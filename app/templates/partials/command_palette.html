<div
  x-data="toolSearch()"
  x-show="open"
  x-cloak
  @keydown.escape.window="close()"
  class="fixed inset-0 z-[90] flex items-start justify-center bg-slate-900/50 px-4 pt-24"
>
  <div @click.outside="close()" class="w-full max-w-xl rounded-xl bg-white shadow-2xl" role="dialog" aria-modal="true" aria-label="Busca de ferramentas">
    <div class="flex items-center gap-2 border-b border-slate-100 px-4 py-3">
      <span aria-hidden="true" class="text-slate-400">🔎</span>
      <input
        x-ref="input"
        type="text"
        x-model="query"
        @keydown.down.prevent="move(1)"
        @keydown.up.prevent="move(-1)"
        @keydown.enter.prevent="goToActive()"
        placeholder="Buscar por nome da ferramenta ou categoria…"
        class="w-full border-0 py-1 text-sm focus:outline-none focus:ring-0"
        aria-label="Buscar ferramenta"
      >
      <kbd class="rounded border border-slate-200 px-1.5 py-0.5 text-xs text-slate-400">Esc</kbd>
    </div>
    <ul class="max-h-80 overflow-y-auto py-2">
      <template x-for="(item, index) in results" :key="item.url">
        <li>
          <a
            :href="item.url"
            class="flex items-center justify-between px-4 py-2 text-sm no-underline"
            :class="index === activeIndex ? 'bg-brand-50 text-brand-700' : 'text-slate-700'"
            @mouseenter="activeIndex = index"
          >
            <span x-text="item.name"></span>
            <span class="text-xs text-slate-400" x-text="item.category"></span>
          </a>
        </li>
      </template>
      <li x-show="results.length === 0" x-cloak class="px-4 py-6 text-center text-sm text-slate-400">
        Nenhuma ferramenta encontrada.
      </li>
    </ul>
  </div>
</div>
