# Base = seguro para produção (sem portas de Postgres/Redis publicadas, sem
# bind-mount de código, comandos de produção). Para desenvolvimento, o
# `docker-compose.override.yml` neste mesmo diretório é carregado
# automaticamente quando você roda `docker compose up` sem `-f` — ele
# adiciona as portas de dev, o serviço `analisa_assets` e o hot-reload.
#
# Produção:      docker compose -f docker-compose.yml up -d --build
# Desenvolvimento: docker compose up --build   (override entra sozinho)
name: analisa-to

x-app-env: &app-env
  env_file:
    - .env

services:
  analisa_postgres:
    image: postgres:16-alpine
    container_name: analisa_postgres
    <<: *app-env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-analisa_to}
      POSTGRES_USER: ${POSTGRES_USER:-analisa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-analisa}
    volumes:
      - analisa_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/generate-conf.sh:/docker-entrypoint-initdb.d/00-generate-conf.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-analisa} -d $${POSTGRES_DB:-analisa_to}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  analisa_redis:
    image: redis:7-alpine
    container_name: analisa_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-analisa}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-analisa}
    volumes:
      - analisa_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-analisa} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  analisa_web:
    build:
      context: .
      target: runtime
    container_name: analisa_web
    <<: *app-env
    command: >
      gunicorn --bind 0.0.0.0:5000 --worker-class gthread --workers 4
      --threads 4 --timeout 60 --access-logfile - --error-logfile - wsgi:app
    volumes:
      - analisa_generated_pages:/data/generated-pages
      - analisa_sitemaps:/data/sitemaps
      - analisa_logs:/app/logs
      - analisa_backups:/app/backups
    ports:
      - "${APP_HTTP_PORT:-18473}:5000"
    depends_on:
      analisa_postgres:
        condition: service_healthy
      analisa_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  analisa_worker:
    build:
      context: .
      target: runtime
    container_name: analisa_worker
    <<: *app-env
    command: celery -A make_celery.celery_app worker --loglevel=info --concurrency=4
    volumes:
      - analisa_generated_pages:/data/generated-pages
      - analisa_sitemaps:/data/sitemaps
      - analisa_logs:/app/logs
      - analisa_backups:/app/backups
    depends_on:
      analisa_postgres:
        condition: service_healthy
      analisa_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A make_celery.celery_app inspect ping -d celery@$$HOSTNAME | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  analisa_scheduler:
    build:
      context: .
      target: runtime
    container_name: analisa_scheduler
    <<: *app-env
    command: celery -A make_celery.celery_app beat --loglevel=info
    volumes:
      - analisa_logs:/app/logs
    healthcheck:
      # Sem override, este serviço herdaria o HEALTHCHECK da imagem (curl em
      # localhost:5000), que nunca existe aqui — celery beat não serve HTTP.
      disable: true
    depends_on:
      analisa_postgres:
        condition: service_healthy
      analisa_redis:
        condition: service_healthy
    restart: unless-stopped

  # CAPTCHA self-hosted (Cap — https://trycap.dev). Ao contrário de
  # Postgres/Redis, este serviço PRECISA ficar publicamente acessível: é o
  # navegador do visitante que fala com ele diretamente para resolver o
  # desafio (proof-of-work), então a porta é publicada mesmo no compose de
  # produção — troque `CAP_PUBLIC_URL` por um domínio/TLS próprio nesse caso.
  analisa_cap_store:
    image: valkey/valkey:8-alpine
    container_name: analisa_cap_store
    volumes:
      - analisa_cap_store_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  analisa_cap:
    image: tiago2/cap:latest
    container_name: analisa_cap
    environment:
      ADMIN_KEY: ${CAP_ADMIN_KEY:-change-me-cap-admin-key-min-32-characters}
      REDIS_URL: redis://analisa_cap_store:6379
      # Serve o JS/WASM do widget a partir do próprio analisa_cap (em vez do
      # navegador buscar em cdn.jsdelivr.net) — mantém tudo self-hosted.
      ENABLE_ASSETS_SERVER: "true"
    ports:
      - "${CAP_HTTP_PORT:-3010}:3000"
    depends_on:
      analisa_cap_store:
        condition: service_healthy
    healthcheck:
      # A imagem não tem curl/wget; usa o fetch nativo do bun (runtime desta imagem).
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  analisa_postgres_data:
  analisa_redis_data:
  analisa_generated_pages:
  analisa_sitemaps:
  analisa_logs:
  analisa_backups:
  analisa_node_modules:
  analisa_cap_store_data:
